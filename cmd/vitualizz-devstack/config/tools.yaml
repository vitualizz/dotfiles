themes:
  - name: vitualizz
    display_name: "Vitualizz"
    category: theme
    colors:
      background: "0x1A1B26"
      foreground: "0xC0CAF5"
      normal:
        black: "0x414868"
        red: "0xF7768E"
        green: "0x73DACA"
        yellow: "0xE0AF68"
        blue: "0x7AA2F7"
        magenta: "0xBB9AF7"
        cyan: "0x7DCFFF"
        white: "0xC0CAF5"
      bright:
        black: "0x414868"
        red: "0xF7768E"
        green: "0x73DACA"
        yellow: "0xE0AF68"
        blue: "0x7AA2F7"
        magenta: "0xBB9AF7"
        cyan: "0x7DCFFF"
        white: "0xC0CAF5"

tools:
  - name: kitty
    category: terminal
    install:
      all: |
        curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin launch=n
        ln -sf ~/.local/kitty.app/bin/kitty ~/.local/bin/kitty
      macos: brew install --cask kitty
    uninstall:
      macos: brew uninstall --cask kitty
      arch: sudo pacman -R --noconfirm kitty
      debian: sudo apt-get remove -y kitty
      fedora: sudo dnf remove -y kitty
    check: kitty --version
    description: "Emulador de terminal rápido"
    enabled: true
    required: true

  - name: kitty-config
    category: terminal
    depends_on: [kitty]
    install:
      all: |
        mkdir -p ~/.config/kitty/vitualizz
        cp $DEVSTACK_CONFIG/kitty/* ~/.config/kitty/vitualizz/
        if ! grep -qs "^include vitualizz/kitty.conf$" ~/.config/kitty/kitty.conf; then
          [ -f ~/.config/kitty/kitty.conf ] && cp ~/.config/kitty/kitty.conf ~/.config/kitty/kitty.conf.bak-$(date +%Y%m%d%H%M%S)
          CURRENT=$(cat ~/.config/kitty/kitty.conf 2>/dev/null)
          printf 'include vitualizz/kitty.conf\n%s\n' "$CURRENT" > ~/.config/kitty/kitty.conf
        fi
    uninstall:
      all: |
        if [ -f ~/.config/kitty/kitty.conf ]; then
          KEEP=$(grep -v "^include vitualizz/kitty.conf$" ~/.config/kitty/kitty.conf)
          printf '%s\n' "$KEEP" > ~/.config/kitty/kitty.conf
        fi
        rm -rf ~/.config/kitty/vitualizz
    check: grep -qs "^include vitualizz/kitty.conf$" ~/.config/kitty/kitty.conf && test -f ~/.config/kitty/vitualizz/kitty.conf
    description: "Config Tokyo Night para Kitty"
    enabled: true
    required: false

  - name: zsh
    category: shell
    install:
      debian: sudo apt-get install -y zsh
      arch: sudo pacman -S --noconfirm zsh
      fedora: sudo dnf install -y zsh
      suse: sudo zypper install -y zsh
      brew: brew install zsh
    uninstall:
      macos: echo "zsh is part of macOS; leaving it in place"
      debian: sudo apt-get remove -y zsh
      arch: sudo pacman -R --noconfirm zsh
      fedora: sudo dnf remove -y zsh
    check: zsh --version
    description: "Shell Zsh"
    enabled: true
    required: true
    alternatives: [bash, fish]

  - name: zsh-config
    category: shell
    depends_on: [zsh]
    install:
      all: |
        mkdir -p ~/.config/vitualizz-devstack
        cp $DEVSTACK_CONFIG/zsh/zshrc ~/.config/vitualizz-devstack/zshrc
        if ! grep -qs "# vitualizz-devstack$" ~/.zshrc; then
          [ -f ~/.zshrc ] && cp ~/.zshrc ~/.zshrc.bak-$(date +%Y%m%d%H%M%S)
          printf '\n%s\n' '[[ -r ~/.config/vitualizz-devstack/zshrc ]] && source ~/.config/vitualizz-devstack/zshrc  # vitualizz-devstack' >> ~/.zshrc
        fi
    uninstall:
      all: |
        if [ -f ~/.zshrc ]; then
          KEEP=$(grep -v "# vitualizz-devstack$" ~/.zshrc)
          printf '%s\n' "$KEEP" > ~/.zshrc
        fi
        rm -rf ~/.config/vitualizz-devstack
    check: grep -qs "# vitualizz-devstack$" ~/.zshrc && test -f ~/.config/vitualizz-devstack/zshrc
    description: "Configuración personal para Zsh"
    enabled: true
    required: false

  - name: starship
    category: shell
    depends_on: [zsh]
    install:
      brew: brew install starship
      fallback: curl -sS https://starship.rs/install.sh | sh -s -- --yes --force
    uninstall:
      brew: brew uninstall starship
      all: rm -f ~/.local/bin/starship
    check: starship --version
    description: "Prompt moderno para Shell"
    enabled: true
    required: false
    source_url: https://starship.rs

  - name: neovim
    category: editor
    install:
      debian: |
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:neovim-ppa/stable
        sudo apt-get update
        sudo apt-get install -y neovim
      arch: sudo pacman -S --noconfirm neovim
      fedora: sudo dnf install -y neovim
      brew: brew install neovim
      fallback: |
        curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
        sudo tar xzf nvim-linux-x86_64.tar.gz -C /opt
        sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
        rm -f nvim-linux-x86_64.tar.gz
    uninstall:
      debian: sudo apt-get remove -y neovim
      arch: sudo pacman -R --noconfirm neovim
      fedora: sudo dnf remove -y neovim
      brew: brew uninstall neovim
      fallback: sudo rm -f /usr/local/bin/nvim
    check: nvim --version
    description: "Editor de texto (Neovim)"
    enabled: true
    required: true
    source_url: https://github.com/neovim/neovim

  - name: mise
    category: tools
    install:
      brew: brew install mise
      fallback: curl https://mise.run | MISE_YES=1 sh
    uninstall:
      brew: brew uninstall mise
      all: rm -rf ~/.local/share/mise
    check: mise --version
    description: "Gestor de versiones (Rust, Node, Python)"
    enabled: true
    required: true
    source_url: https://mise.jdx.dev

  - name: build-essential
    category: tools
    install:
      debian: sudo apt-get install -y build-essential
      arch: sudo pacman -S --noconfirm base-devel
      fedora: sudo dnf groupinstall -y "Development Tools"
      suse: sudo zypper install -y -t pattern devel_basis
      macos: |
        xcode-select -p >/dev/null 2>&1 || {
          xcode-select --install
          echo "Accept the Xcode Command Line Tools dialog, then run DevStack again." >&2
          exit 1
        }
    check: gcc --version
    description: "Build tools (gcc, g++, make) needed for cargo install"
    enabled: true
    required: true

  - name: rustup
    category: tools
    install:
      all: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        RC_LINE='export PATH="$HOME/.cargo/bin:$PATH"'
        for rc in ~/.bashrc ~/.zshrc; do
          if [ -f "$rc" ]; then
            grep -qF "$RC_LINE" "$rc" 2>/dev/null || echo "$RC_LINE" >> "$rc"
          fi
        done
        [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
    uninstall:
      all: rustup self uninstall -y
    check: rustup --version
    description: "Gestor de versiones de Rust y Cargo"
    enabled: true
    required: false
    source_url: https://rustup.rs

  - name: opencode
    category: tools
    install:
      brew: brew install opencode
      all: curl -fsSL https://opencode.ai/install | bash
    uninstall:
      brew: brew uninstall opencode
      all: rm -f ~/.opencode/bin/opencode
    check: opencode --version
    description: "Asistente de IA para programar"
    enabled: true
    required: false
    source_url: https://opencode.ai

  - name: docker
    category: container
    install:
      macos: brew install --cask docker-desktop
      all: curl -fsSL https://get.docker.com | sh
    uninstall:
      macos: brew uninstall --cask docker-desktop
      debian: sudo apt-get remove -y docker-ce
      arch: sudo pacman -R --noconfirm docker
      fedora: sudo dnf remove -y docker-ce
    check: docker --version
    description: "Plataforma de contenedores"
    enabled: true
    required: false
    source_url: https://docker.com

  - name: docker-compose
    category: container
    depends_on: [docker]
    install:
      debian: |
        sudo apt-get update
        sudo apt-get install -y docker-compose-plugin
      arch: |
        sudo pacman -S --noconfirm docker-compose
      fedora: |
        sudo dnf install -y docker-compose
      macos: |
        docker compose version || {
          echo "docker compose ships with Docker Desktop: install docker first and open Docker.app once." >&2
          exit 1
        }
      fallback: |
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
    uninstall:
      debian: sudo apt-get remove -y docker-compose-plugin
      arch: sudo pacman -R --noconfirm docker-compose
      fedora: sudo dnf remove -y docker-compose
      macos: echo "docker compose is bundled with Docker Desktop; uninstall docker instead"
      fallback: sudo rm -f /usr/local/bin/docker-compose
    check: docker compose version
    description: "Plugin Docker Compose"
    enabled: true
    required: false
    source_url: https://github.com/docker/compose

  - name: fzf
    category: tools
    install:
      debian: sudo apt-get install -y fzf
      arch: sudo pacman -S --noconfirm fzf
      fedora: sudo dnf install -y fzf
      brew: brew install fzf
      fallback: |
        git clone --depth 1 https://github.com/junegunn/fzf.git ~/.fzf
        yes | ~/.fzf/install --bin
    uninstall:
      brew: brew uninstall fzf
      all: rm -rf ~/.fzf
    check: fzf --version
    description: "Buscador difuso interactivo"
    enabled: true
    required: false
    source_url: https://github.com/junegunn/fzf

  - name: bat
    category: tools
    install:
      debian: sudo apt-get install -y bat
      arch: sudo pacman -S --noconfirm bat
      fedora: sudo dnf install -y bat
      brew: brew install bat
      fallback: cargo install bat
    uninstall:
      debian: sudo apt-get remove -y bat
      arch: sudo pacman -R --noconfirm bat
      fedora: sudo dnf remove -y bat
      brew: brew uninstall bat
      fallback: cargo uninstall bat
    check: bat --version
    description: "cat con resaltado de sintaxis"
    enabled: true
    required: false
    source_url: https://github.com/sharkdp/bat

  - name: eza
    category: tools
    install:
      debian: |
        mkdir -p /etc/apt/keyrings
        wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc | sudo gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
        echo "deb [signed-by=/etc/apt/keyrings/gierens.gpg] https://deb.gierens.de stable main" | sudo tee /etc/apt/sources.list.d/gierens.list
        sudo apt-get update
        sudo apt-get install -y eza
      arch: sudo pacman -S --noconfirm eza
      fedora: sudo dnf install -y eza
      brew: brew install eza
      fallback: cargo install eza
    uninstall:
      arch: sudo pacman -R --noconfirm eza
      fedora: sudo dnf remove -y eza
      brew: brew uninstall eza
      fallback: cargo uninstall eza
    check: eza --version
    description: "Reemplazo moderno de ls"
    enabled: true
    required: false
    source_url: https://github.com/eza-community/eza

  - name: yazi
    category: tools
    depends_on: [rustup, build-essential]
    install:
      brew: brew install yazi
      all: cargo install yazi-fm yazi-cli --locked
    uninstall:
      brew: brew uninstall yazi
      all: cargo uninstall yazi-fm yazi-cli
    check: ya --version
    description: "Gestor de archivos en terminal"
    enabled: true
    required: false
    source_url: https://github.com/sxyazi/yazi

  - name: jq
    category: tools
    install:
      debian: sudo apt-get install -y jq
      arch: sudo pacman -S --noconfirm jq
      fedora: sudo dnf install -y jq
      suse: sudo zypper install -y jq
      brew: brew install jq
    uninstall:
      debian: sudo apt-get remove -y jq
      arch: sudo pacman -R --noconfirm jq
      fedora: sudo dnf remove -y jq
      suse: sudo zypper remove -y jq
      brew: brew uninstall jq
    check: jq --version
    description: "Procesador de JSON"
    enabled: true
    required: false

  - name: lazygit
    category: tools
    install:
      all: |
        LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest" | grep -Po '"tag_name": *"v\K[^"]*')
        LAZYGIT_ARCH=$(uname -m | sed -e 's/aarch64/arm64/')
        curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VERSION}/lazygit_${LAZYGIT_VERSION}_Linux_${LAZYGIT_ARCH}.tar.gz"
        tar xf lazygit.tar.gz lazygit
        sudo install lazygit -D -t /usr/local/bin/
        rm -f lazygit.tar.gz
      brew: brew install lazygit
    uninstall:
      brew: brew uninstall lazygit
      all: rm -f ~/.local/bin/lazygit
    check: lazygit --version
    description: "UI visual para Git"
    enabled: true
    required: false
    source_url: https://github.com/jesseduffield/lazygit

  - name: direnv
    category: tools
    install:
      debian: sudo apt-get install -y direnv
      arch: sudo pacman -S --noconfirm direnv
      fedora: sudo dnf install -y direnv
      suse: sudo zypper install -y direnv
      brew: brew install direnv
    uninstall:
      debian: sudo apt-get remove -y direnv
      arch: sudo pacman -R --noconfirm direnv
      fedora: sudo dnf remove -y direnv
      suse: sudo zypper remove -y direnv
      brew: brew uninstall direnv
    check: direnv --version
    description: "Variables de entorno por directorio"
    enabled: true
    required: false
    source_url: https://github.com/direnv/direnv

  - name: zoxide
    category: tools
    install:
      brew: brew install zoxide
      fallback: curl -sSL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
    uninstall:
      brew: brew uninstall zoxide
      all: rm -f ~/.local/bin/zoxide
    check: zoxide --version
    description: "cd inteligente que aprende"
    enabled: true
    required: false
    source_url: https://github.com/ajeetdsouza/zoxide

  - name: bottom
    category: tools
    depends_on: [rustup, build-essential]
    install:
      brew: brew install bottom
      all: cargo install bottom --locked
    uninstall:
      brew: brew uninstall bottom
      all: cargo uninstall bottom
    check: btm --version
    description: "Monitor del sistema"
    enabled: true
    required: false
    source_url: https://github.com/ClementTsang/bottom

  - name: gh
    category: tools
    install:
      debian: |
        type -p curl >/dev/null || sudo apt-get install -y curl
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y gh
      arch: sudo pacman -S --noconfirm github-cli
      fedora: sudo dnf install -y gh
      brew: brew install gh
    uninstall:
      debian: sudo apt-get remove -y gh
      arch: sudo pacman -R --noconfirm github-cli
      fedora: sudo dnf remove -y gh
      brew: brew uninstall gh
    check: gh --version
    description: "CLI de GitHub"
    enabled: true
    required: false
    source_url: https://github.com/cli/cli

  - name: uv
    category: tools
    install:
      brew: brew install uv
      all: curl -LsSf https://astral.sh/uv/install.sh | sh
    uninstall:
      brew: brew uninstall uv
      all: rm -f ~/.local/bin/uv
    check: uv --version
    description: "Gestor de paquetes Python ultrarrápido"
    enabled: true
    required: false
    source_url: https://github.com/astral-sh/uv

  - name: httpie
    category: tools
    install:
      debian: sudo apt-get install -y httpie
      arch: sudo pacman -S --noconfirm httpie
      fedora: sudo dnf install -y httpie
      brew: brew install httpie
      fallback: python3 -m pip install --user httpie
    uninstall:
      debian: sudo apt-get remove -y httpie
      arch: sudo pacman -R --noconfirm httpie
      fedora: sudo dnf remove -y httpie
      brew: brew uninstall httpie
      fallback: python3 -m pip uninstall -y httpie
    check: http --version
    description: "Cliente HTTP amigable"
    enabled: true
    required: false
    source_url: https://github.com/httpie/httpie

  - name: yq
    category: tools
    install:
      debian: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
      arch: yay -S --noconfirm yq
      fedora: sudo dnf install -y yq
      brew: brew install yq
    uninstall:
      debian: sudo rm -f /usr/local/bin/yq
      arch: sudo pacman -R --noconfirm yq
      fedora: sudo dnf remove -y yq
      brew: brew uninstall yq
    check: yq --version
    description: "Procesador de YAML"
    enabled: true
    required: false
    source_url: https://github.com/mikefarah/yq

  - name: ripgrep
    category: tools
    install:
      debian: sudo apt-get install -y ripgrep
      arch: sudo pacman -S --noconfirm ripgrep
      fedora: sudo dnf install -y ripgrep
      brew: brew install ripgrep
    uninstall:
      debian: sudo apt-get remove -y ripgrep
      arch: sudo pacman -R --noconfirm ripgrep
      fedora: sudo dnf remove -y ripgrep
      brew: brew uninstall ripgrep
    check: rg --version
    description: "Búsqueda de texto ultrarrápida (rg)"
    enabled: true
    required: false
    source_url: https://github.com/BurntSushi/ripgrep

  - name: fd
    category: tools
    install:
      debian: |
        sudo apt-get install -y fd-find
        sudo ln -sf $(which fdfind) /usr/local/bin/fd 2>/dev/null || true
      arch: sudo pacman -S --noconfirm fd
      fedora: sudo dnf install -y fd-find
      brew: brew install fd
    uninstall:
      debian: sudo apt-get remove -y fd-find
      arch: sudo pacman -R --noconfirm fd
      fedora: sudo dnf remove -y fd-find
      brew: brew uninstall fd
    check: fd --version
    description: "Buscador de archivos moderno"
    enabled: true
    required: false
    source_url: https://github.com/sharkdp/fd

  - name: sd
    category: tools
    depends_on: [rustup, build-essential]
    install:
      brew: brew install sd
      fallback: . "$HOME/.cargo/env" && cargo install sd --quiet
    uninstall:
      brew: brew uninstall sd
      all: . "$HOME/.cargo/env" && cargo uninstall sd
    check: sd --version
    description: "Reemplazo moderno de sed"
    enabled: true
    required: false
    source_url: https://github.com/chmln/sd

  - name: delta
    category: tools
    install:
      debian: |
        DELTA_VERSION=$(curl -s https://api.github.com/repos/dandavison/delta/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        curl -Lo /tmp/delta.deb "https://github.com/dandavison/delta/releases/download/${DELTA_VERSION}/git-delta_${DELTA_VERSION}_amd64.deb"
        sudo dpkg -i /tmp/delta.deb
        rm /tmp/delta.deb
      arch: sudo pacman -S --noconfirm git-delta
      fedora: sudo dnf install -y git-delta
      brew: brew install git-delta
    uninstall:
      debian: sudo dpkg -r git-delta
      arch: sudo pacman -R --noconfirm git-delta
      fedora: sudo dnf remove -y git-delta
      brew: brew uninstall git-delta
      all: rm -f /usr/local/bin/delta
    check: delta --version
    description: "Diff con syntax highlighting para Git"
    enabled: true
    required: false
    source_url: https://github.com/dandavison/delta

  - name: duf
    category: tools
    install:
      debian: sudo apt-get install -y duf
      arch: sudo pacman -S --noconfirm duf
      fedora: sudo dnf install -y duf
      brew: brew install duf
    uninstall:
      debian: sudo apt-get remove -y duf
      arch: sudo pacman -R --noconfirm duf
      fedora: sudo dnf remove -y duf
      brew: brew uninstall duf
    check: duf --version
    description: "Reemplazo moderno de df (uso de disco)"
    enabled: true
    required: false
    source_url: https://github.com/muesli/duf

  - name: dust
    category: tools
    install:
      debian: |
        curl -sLo /tmp/dust.deb "https://github.com/bootandy/dust/releases/latest/download/dust_$(dpkg --print-architecture).deb"
        sudo dpkg -i /tmp/dust.deb
        rm -f /tmp/dust.deb
      arch: sudo pacman -S --noconfirm dust
      brew: brew install dust
      fallback: cargo install du-dust
    uninstall:
      arch: sudo pacman -R --noconfirm dust
      brew: brew uninstall dust
      all: rm -f /usr/local/bin/dust
    check: dust --version
    description: "Reemplazo moderno de du (uso de disco por directorio)"
    enabled: true
    required: false
    source_url: https://github.com/bootandy/dust

  - name: fastfetch
    category: tools
    install:
      debian: |
        sudo apt-get install -y fastfetch || {
          curl -Lo /tmp/fastfetch.deb "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb"
          sudo dpkg -i /tmp/fastfetch.deb
          rm -f /tmp/fastfetch.deb
        }
      arch: sudo pacman -S --noconfirm fastfetch
      fedora: sudo dnf install -y fastfetch
      brew: brew install fastfetch
    uninstall:
      debian: sudo apt-get remove -y fastfetch
      arch: sudo pacman -R --noconfirm fastfetch
      fedora: sudo dnf remove -y fastfetch
      brew: brew uninstall fastfetch
    check: fastfetch --version
    description: "Info del sistema con estilo (neofetch moderno)"
    enabled: true
    required: false
    source_url: https://github.com/fastfetch-cli/fastfetch

  - name: btop
    category: tools
    install:
      debian: sudo apt-get install -y btop
      arch: sudo pacman -S --noconfirm btop
      fedora: sudo dnf install -y btop
      brew: brew install btop
    uninstall:
      debian: sudo apt-get remove -y btop
      arch: sudo pacman -R --noconfirm btop
      fedora: sudo dnf remove -y btop
      brew: brew uninstall btop
    check: btop --version
    description: "Monitor del sistema visual (dashboard estilo sci-fi)"
    enabled: true
    required: false
    source_url: https://github.com/aristocratos/btop

  - name: onefetch
    category: tools
    install:
      debian: |
        wget https://github.com/o2sh/onefetch/releases/latest/download/onefetch_amd64.deb && sudo dpkg -i ./onefetch_amd64.deb
      arch: sudo pacman -S --noconfirm onefetch
      brew: brew install onefetch
      fallback: cargo install onefetch
    uninstall:
      arch: sudo pacman -R --noconfirm onefetch
      brew: brew uninstall onefetch
      all: rm -f /usr/local/bin/onefetch
    check: onefetch --version
    description: "Resumen visual del repo git (como neofetch para proyectos)"
    enabled: true
    required: false
    source_url: https://github.com/o2sh/onefetch

  - name: glow
    category: tools
    install:
      debian: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
        echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
        sudo apt update && sudo apt install glow
      arch: sudo pacman -S --noconfirm glow
      fedora: sudo dnf install -y glow
      brew: brew install glow
    uninstall:
      debian: sudo dpkg -r glow
      arch: sudo pacman -R --noconfirm glow
      fedora: sudo dnf remove -y glow
      brew: brew uninstall glow
    check: glow --version
    description: "Markdown renderizado en la terminal"
    enabled: true
    required: false
    source_url: https://github.com/charmbracelet/glow

