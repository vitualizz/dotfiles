add_newline = true

format = """[](fg:13)[ ❤ ](fg:232 bg:13)$directory$git_branch$git_status[](fg:prev_bg) """

[directory]
style = "fg:232 bg:14"
format = "[](fg:prev_bg bg:14)[ $path$read_only ]($style)"
truncation_length = 1
truncation_symbol = ""
fish_style_pwd_dir_length = 1
truncate_to_repo = false
read_only = " "

[git_branch]
style = "fg:232 bg:2"
symbol = " "
format = "[](fg:prev_bg bg:2)[ $symbol$branch]($style)"

[git_status]
style = "fg:232 bg:2"
format = "[( $ahead_behind$stashed$conflicted$staged$modified$untracked) ]($style)"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
stashed = "*${count} "
conflicted = "~${count} "
staged = "+${count} "
modified = "!${count} "
untracked = "?${count} "
