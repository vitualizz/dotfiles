version: 2

project_name: dotfiles

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: dotfiles
    main: ./cmd/dotfiles/main.go
    binary: dotfiles
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - binary
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Vitualizz Dotfiles {{ .Tag }}

    [![Downloads](https://img.shields.io/github/downloads/vitualizz/dotfiles/{{ .Tag }}/total)](https://github.com/vitualizz/dotfiles/releases)

    ### Quick Install

    Linux and macOS (macOS requires [Homebrew](https://brew.sh)). No `sudo`: it asks for your password when needed.
    ```bash
    curl -fsSL https://raw.githubusercontent.com/vitualizz/dotfiles/master/install.sh | bash
    ```

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - Merge pull request
      - Merge branch
